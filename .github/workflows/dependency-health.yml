name: Dependency Health

on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      run_audio_smoke:
        description: "Exécuter le smoke test audio réel (nécessite HF_TOKEN + stack locale complète)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  dependency-matrix:
    name: "${{ matrix.profile }} / py${{ matrix.python-version }}"
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
        profile: ["core", "image-local", "audio-local", "tts-local"]
        include:
          - profile: core
            imports: "yaml,fastapi,pydantic,PIL,requests"
          - profile: image-local
            imports: "yaml,fastapi,pydantic,PIL,requests,torch,diffusers,transformers,accelerate,rembg,onnxruntime"
          - profile: audio-local
            imports: "yaml,fastapi,pydantic,PIL,requests,torch,audiocraft,xformers,sklearn"
          - profile: tts-local
            imports: "yaml,fastapi,pydantic,PIL,requests,kokoro,soundfile"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"

      - name: Installer les dépendances du profil
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ("${{ matrix.profile }}" -eq "audio-local") {
            python -m pip install -r requirements/profiles/core.txt
            python -m pip install torch==2.6.0+cu124 torchaudio==2.6.0+cu124 torchvision==0.21.0+cu124 --index-url https://download.pytorch.org/whl/cu124
            python -m pip install audiocraft==1.3.0 --no-deps
            python -m pip install omegaconf hydra-core hydra_colorlog julius num2words sentencepiece encodec einops dora-search flashy librosa torchmetrics av -c constraints.txt
            python -m pip install xformers==0.0.29.post3 scikit-learn==1.5.2 kiwisolver==1.4.5 -c constraints.txt
            python -m pip install "git+https://github.com/Stability-AI/stable-audio-tools.git@3241adba4fc2a85cf5b29d9eb68d42f40a28e820" --no-deps --ignore-requires-python -c constraints.txt
            python -m pip install k-diffusion x-transformers local-attention vector-quantize-pytorch alias-free-torch ema-pytorch descript-audio-codec einops-exts prefigure auraloss PyWavelets -c constraints.txt
          } else {
            python -m pip install -r "requirements/profiles/${{ matrix.profile }}.txt"
          }
          python -m pip check

      - name: Checks d'import
        shell: pwsh
        run: |
          $mods = "${{ matrix.imports }}".Split(",")
          foreach ($m in $mods) {
            python -c "import $m; print('$m OK')"
          }

      - name: Dependency compatibility report
        shell: pwsh
        run: |
          python scripts/dependency_compat_report.py --strict --format markdown --out dependency-report.md
          Get-Content dependency-report.md

      - name: Smoke test génération réelle courte (procédural)
        shell: pwsh
        run: |
          $code = @'
          from pathlib import Path
          from studio.procedural import new_canvas, centered_text, save_png
          out = Path("smoke-procedural.png")
          im = new_canvas(256, 256, (22, 22, 34, 255))
          centered_text(im, "SMOKE", size=28, fill=(240, 240, 255, 255))
          save_png(im, out)
          assert out.exists() and out.stat().st_size > 0
          print(out, out.stat().st_size)
          '@
          python -c $code

      - name: Smoke test audio réel court (optionnel)
        if: ${{ matrix.profile == 'audio-local' && github.event_name == 'workflow_dispatch' && inputs.run_audio_smoke && secrets.HF_TOKEN != '' }}
        shell: pwsh
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python scripts/validate_stable_audio.py --only sfx
